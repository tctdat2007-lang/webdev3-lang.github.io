<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Task 2</title>
</head>
<body>
<ul id="target"></ul>

<script>
    const target = document.getElementById("target");
    const items = ["First item", "Second item", "Third item"];

    items.forEach((text, index) => {
        const li = document.createElement("li");
        li.textContent = text;

        if (index === 1) {
            li.classList.add("my-item");
        }

        target.appendChild(li);
    });
</script>

</body>
</html>
